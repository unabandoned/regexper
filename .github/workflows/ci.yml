name: CI
on:
  push:
    branches: [master]
  pull_request:
jobs:
  ci:
    permissions:
      contents: read
    uses: unabandoned/.github/.github/workflows/reusable-ci.yml@21b556478d51be2e553cb1bf790b54b1812e3fce # v1.3.1
    with:
      node-versions: '[22, 24]'
      # The published files are generated — canopy compiles the grammar and tsc
      # emits es/ and lib/ — so the test suites have nothing to run against until
      # the build has run.
      has-build: true
