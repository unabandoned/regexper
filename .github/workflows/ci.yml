name: CI
on:
  push:
    branches: [master]
  pull_request:
jobs:
  ci:
    permissions:
      contents: read
    uses: unabandoned/.github/.github/workflows/reusable-ci.yml@7df8c67cf681d8fc7ee0831d74c1e9d8640b12a9 # v1.3.4
    with:
      node-versions: '[22, 24]'
      # The published files are generated — canopy compiles the grammar and tsc
      # emits es/ and lib/ — so the test suites have nothing to run against until
      # the build has run.
      has-build: true
