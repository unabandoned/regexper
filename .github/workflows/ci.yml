name: CI
on:
  push:
    branches: [master]
  pull_request:
jobs:
  ci:
    permissions:
      contents: read
    uses: unabandoned/.github/.github/workflows/reusable-ci.yml@23139a663b090be91f54115baa805f4588255aa5 # v1.3.8
    with:
      node-versions: '[22, 24]'
      # The published files are generated — canopy compiles the grammar and tsc
      # emits es/ and lib/ — so the test suites have nothing to run against until
      # the build has run.
      has-build: true
