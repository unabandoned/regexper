name: CI
on:
  push:
    branches: [master]
  pull_request:
jobs:
  ci:
    permissions:
      contents: read
    uses: unabandoned/.github/.github/workflows/reusable-ci.yml@e1ac1a12a1502bb95671fc2c747e01195dcf9550 # v1.3.2
    with:
      node-versions: '[22, 24]'
      # The published files are generated — canopy compiles the grammar and tsc
      # emits es/ and lib/ — so the test suites have nothing to run against until
      # the build has run.
      has-build: true
