name: CI
on:
  push:
    branches: [master]
  pull_request:
jobs:
  ci:
    permissions:
      contents: read
    uses: unabandoned/.github/.github/workflows/reusable-ci.yml@c24ace1026dd66d9d5ce97d949d9efc5fa9899d1 # v1.3.7
    with:
      node-versions: '[22, 24]'
      # The published files are generated — canopy compiles the grammar and tsc
      # emits es/ and lib/ — so the test suites have nothing to run against until
      # the build has run.
      has-build: true
